name: Build and Release (Windows & Linux)

on:
  push:
    tags: ['*']
  release:
    types: [published]
  # ブランチ指定は成果物の作成のみ。タグ指定ではそのタグへ公開する。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} Binaries & Package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2022
            suffix: .exe
            artifact: windows-assets
          - platform: Linux
            os: ubuntu-24.04
            suffix: ''
            artifact: linux-assets
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Validate build inputs
        run: |
          for file in requirements.txt desktop/daemon/Cargo.lock desktop/kancolle-gui.spec desktop/gui/main.py desktop/icon.ico; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Required build input is missing from this ref: $file"
              exit 1
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64
          # pip キャッシュの依存ファイル自動探索には依存しない。

      - name: Install Python dependencies if missing
        run: |
          if ! python -c "import PySide6, PyInstaller"; then
            python -m pip install -r requirements.txt
          fi
          python -m pip check

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build daemon
        working-directory: desktop/daemon
        run: cargo build --release --locked

      - name: Build GUI
        working-directory: desktop
        run: python -m PyInstaller kancolle-gui.spec --noconfirm

      - name: Collect binaries
        env:
          BINARY_SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p release-files
          cp "desktop/daemon/target/release/kancolle-daemon${BINARY_SUFFIX}" release-files/
          cp "desktop/dist/kancolle-gui${BINARY_SUFFIX}" release-files/

      - name: Compile Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerPaths = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          )
          if (!($compilerPaths | Where-Object { $_ -and (Test-Path -LiteralPath $_) })) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & ./installer/build-installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath dist-installer/kancolle-notify-setup.exe -Destination release-files/

      - name: Package Linux bundle
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-pkg/kancolle-notify
          cp release-files/kancolle-daemon release-files/kancolle-gui release-pkg/kancolle-notify/
          cp desktop/start-daemon.sh desktop/stop-daemon.sh desktop/start-gui.sh release-pkg/kancolle-notify/
          cp -r extension release-pkg/kancolle-notify/
          chmod +x release-pkg/kancolle-notify/kancolle-daemon release-pkg/kancolle-notify/kancolle-gui release-pkg/kancolle-notify/*.sh
          tar -czf release-files/kancolle-notify-linux-x64.tar.gz -C release-pkg kancolle-notify
          mv release-files/kancolle-daemon release-files/kancolle-daemon-linux
          mv release-files/kancolle-gui release-files/kancolle-gui-linux
          cp installer/install.sh release-files/

      - name: Verify package contents
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$PLATFORM" = Windows ]; then
            files=(kancolle-notify-setup.exe kancolle-daemon.exe kancolle-gui.exe)
          else
            files=(kancolle-notify-linux-x64.tar.gz kancolle-daemon-linux kancolle-gui-linux install.sh)
          fi
          for file in "${files[@]}"; do
            if [ ! -s "release-files/$file" ]; then
              echo "::error::Release asset is missing or empty: $file"
              exit 1
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release-files/
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-assets'
          merge-multiple: true
          path: release-files

      - name: Create or update the matching release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          files=(kancolle-notify-setup.exe kancolle-daemon.exe kancolle-gui.exe install.sh kancolle-notify-linux-x64.tar.gz kancolle-daemon-linux kancolle-gui-linux)
          for file in "${files[@]}"; do
            test -s "release-files/$file" || { echo "::error::Missing release asset: $file"; exit 1; }
          done
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-files/* --clobber
