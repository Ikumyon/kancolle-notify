name: Build and Release (Windows & Linux)

on:
  push:
    tags:
      - '*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Binaries & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Daemon (Windows)
        shell: bash
        run: |
          cd desktop/daemon
          cargo build --release
          mkdir -p ../dist
          cp target/release/kancolle-daemon.exe ../dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Build GUI (Windows)
        shell: bash
        run: |
          cd desktop
          pyinstaller kancolle-gui.spec --noconfirm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bundle Worker Script
        run: npm run bundle:worker

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile Installer with Inno Setup
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) {
            $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          }
          Write-Host "Using ISCC: $iscc"
          & $iscc installer/setup.iss

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            dist-installer/kancolle-notify-setup.exe
            desktop/dist/kancolle-daemon.exe
            desktop/dist/kancolle-gui.exe

  build-linux:
    name: Build Linux Binaries & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libgl1 libegl1 libxkbcommon-x11-0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Daemon (Linux)
        run: |
          cd desktop/daemon
          cargo build --release
          mkdir -p ../dist
          cp target/release/kancolle-daemon ../dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Build GUI (Linux)
        run: |
          cd desktop
          pyinstaller kancolle-gui.spec --noconfirm

      - name: Package Linux Bundle (.tar.gz)
        run: |
          mkdir -p release-pkg/kancolle-notify
          cp desktop/dist/kancolle-daemon release-pkg/kancolle-notify/
          cp desktop/dist/kancolle-gui release-pkg/kancolle-notify/
          cp desktop/start-daemon.sh release-pkg/kancolle-notify/
          cp desktop/stop-daemon.sh release-pkg/kancolle-notify/
          cp desktop/start-gui.sh release-pkg/kancolle-notify/
          cp -r extension release-pkg/kancolle-notify/
          chmod +x release-pkg/kancolle-notify/kancolle-daemon release-pkg/kancolle-notify/kancolle-gui release-pkg/kancolle-notify/*.sh
          cd release-pkg
          tar -czvf ../kancolle-notify-linux-x64.tar.gz kancolle-notify
          cd ..
          cp desktop/dist/kancolle-daemon ./kancolle-daemon-linux
          cp desktop/dist/kancolle-gui ./kancolle-gui-linux

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: |
            kancolle-notify-linux-x64.tar.gz
            kancolle-daemon-linux
            kancolle-gui-linux

  publish-release:
    name: Publish Release Assets
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Prepare Release Files
        run: |
          mkdir -p dist-all
          find release-files -type f -exec cp {} dist-all/ \;
          cp installer/install.sh dist-all/install.sh
          ls -la dist-all/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.9.1_beta' }}
          files: |
            dist-all/kancolle-notify-setup.exe
            dist-all/kancolle-daemon.exe
            dist-all/kancolle-gui.exe
            dist-all/install.sh
            dist-all/kancolle-notify-linux-x64.tar.gz
            dist-all/kancolle-daemon-linux
            dist-all/kancolle-gui-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
