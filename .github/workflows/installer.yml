name: Build and Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Inno Setup Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bundle Worker Script
        run: npm run bundle:worker

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile Installer with Inno Setup
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) {
            $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          }
          Write-Host "Using ISCC: $iscc"
          & $iscc tools/installer/setup.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kancolle-notify-setup
          path: dist-installer/kancolle-notify-setup.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/kancolle-notify-setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
